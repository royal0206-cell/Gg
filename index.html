<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>剪刀石頭布｜五勝制冒險</title>
<style>
:root{--bg:#101827;--panel:#192438;--panel2:#202f49;--ink:#f4f7ff;--muted:#b5c2d9;--accent:#8be9c7;--gold:#ffd479;--danger:#ff9b9b}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0%,#2a4262 0,transparent 35%),linear-gradient(135deg,#101827,#17233a);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;padding:28px 16px}
main{max-width:900px;margin:auto}.hero{text-align:center;margin:10px auto 24px}.eyebrow{color:var(--accent);letter-spacing:.18em;font-size:.8rem;font-weight:800}.hero h1{font-size:clamp(2rem,6vw,3.4rem);margin:8px 0}.hero p{color:var(--muted);margin:0}
.panel{background:rgba(25,36,56,.94);border:1px solid #354660;border-radius:22px;padding:22px;margin:16px 0;box-shadow:0 18px 45px #0002}
h2{margin:0 0 14px;font-size:1.25rem}.field{display:flex;gap:10px;flex-wrap:wrap}input[type=text]{flex:1;min-width:180px;background:#0f1929;color:var(--ink);border:1px solid #50627c;border-radius:12px;padding:13px;font:inherit}
.equipment-grid,.hands{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.choice{display:block;text-align:left;background:var(--panel2);color:var(--ink);border:2px solid transparent;border-radius:16px;padding:15px;cursor:pointer;font:inherit;transition:.15s}
.choice:hover{transform:translateY(-2px);border-color:#6887aa}.choice.selected{border-color:var(--accent);background:#203e49}.choice .emoji{font-size:1.8rem;display:block;margin-bottom:7px}.choice strong{display:block;margin-bottom:5px}.choice small{display:block;color:var(--muted);line-height:1.5}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.primary{border:0;border-radius:12px;padding:13px 18px;background:var(--accent);color:#10232b;font:inherit;font-weight:800;cursor:pointer}.primary:disabled{opacity:.4;cursor:not-allowed}.secondary{border:1px solid #526680;border-radius:12px;padding:11px 16px;background:transparent;color:var(--ink);font:inherit;cursor:pointer}
#game{display:none}.scoreboard{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}.score{background:#101a2a;border-radius:15px;padding:15px;text-align:center}.score span{display:block;color:var(--muted);font-size:.9rem}.score strong{font-size:2.3rem}.round{text-align:center;color:var(--gold);font-weight:800;margin:4px 0 16px}.hands .choice{text-align:center;padding:18px 8px}.hands .emoji{font-size:2.5rem}.hands .choice strong{font-size:1rem}.status{background:#101a2a;border-radius:14px;padding:15px;text-align:center;margin-top:16px;min-height:58px;line-height:1.6}.equipment-status{color:var(--muted);font-size:.9rem;margin-top:10px}.log{margin-top:14px;color:var(--muted);font-size:.92rem;max-height:180px;overflow:auto}.log p{margin:7px 0;padding-bottom:7px;border-bottom:1px solid #304057}.hidden{display:none!important}.footer{text-align:center;color:#8797b0;font-size:.82rem;padding:10px}
@media(max-width:600px){.equipment-grid,.hands{grid-template-columns:1fr}.choice{padding:13px}.panel{padding:17px}.hands .choice{text-align:left;display:flex;align-items:center;gap:14px}.hands .emoji{margin:0}.hands .choice small{display:inline}}
</style>
</head>
<body>
<main>
<header class="hero">
  <div class="eyebrow">ADVENTURER CHALLENGE</div>
  <h1>✊ ✋ ✌️ 剪刀石頭布</h1>
  <p>五勝制終極大對決・選擇裝備，挑戰電腦！</p>
</header>
<section class="panel" id="setup">
  <h2>🧭 冒險者登入</h2>
  <div class="field"><input id="playerName" type="text" maxlength="24" placeholder="請輸入你的冒險者名字" value="冒險者"><button class="primary" id="startBtn">開始冒險</button></div>
  <h2 style="margin-top:24px">🎒 選擇你的裝備</h2>
  <div class="equipment-grid" id="equipmentGrid">
    <button class="choice selected" data-equip="lucky"><span class="emoji">🍀</span><strong>幸運護符</strong><small>每局一次，可讓電腦重新出拳。</small></button>
    <button class="choice" data-equip="shield"><span class="emoji">🛡️</span><strong>守護盾牌</strong><small>每局一次，輸掉回合時可抵消這次失分。</small></button>
    <button class="choice" data-equip="counter"><span class="emoji">💍</span><strong>反擊戒指</strong><small>每局一次，輸掉回合時可改為自己獲得 1 勝。</small></button>
  </div>
</section>
<section class="panel" id="game">
  <div id="welcome" style="margin-bottom:16px"></div>
  <div class="scoreboard">
    <div class="score"><span id="playerLabel">冒險者</span><strong id="playerScore">0</strong><span>勝場</span></div>
    <div class="score"><span>🤖 電腦</span><strong id="computerScore">0</strong><span>勝場</span></div>
  </div>
  <div class="round" id="roundLabel">第 1 回合</div>
  <h2 style="text-align:center">請出拳！</h2>
  <div class="hands">
    <button class="choice" data-hand="剪刀"><span class="emoji">✌️</span><strong>剪刀</strong></button>
    <button class="choice" data-hand="石頭"><span class="emoji">✊</span><strong>石頭</strong></button>
    <button class="choice" data-hand="布"><span class="emoji">✋</span><strong>布</strong></button>
  </div>
  <div class="status" id="status" aria-live="polite">選擇剪刀、石頭或布，開始對決！</div>
  <div class="equipment-status" id="equipmentStatus"></div>
  <div class="log" id="log" aria-label="對戰紀錄"></div>
  <div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px"><button class="primary hidden" id="againBtn">🔄 再來一局</button><button class="secondary" id="changeBtn">更換裝備／玩家</button></div>
</section>
<div class="footer">規則：先取得 5 勝的一方獲勝。平手不計分。</div>
</main>
<script>
const equipment = {
 lucky:{name:"幸運護符",description:"每局一次，可讓電腦重新出拳。",emoji:"🍀"},
 shield:{name:"守護盾牌",description:"每局一次，輸掉回合時可抵消這次失分。",emoji:"🛡️"},
 counter:{name:"反擊戒指",description:"每局一次，輸掉回合時可改為自己獲得 1 勝。",emoji:"💍"}
};
const hands=["剪刀","石頭","布"], emojis={"剪刀":"✌️","石頭":"✊","布":"✋"};
let selectedEquip="lucky",name="冒險者",playerWins=0,computerWins=0,round=1,itemUsed=false,finished=false;
const $=id=>document.getElementById(id);
document.querySelectorAll("[data-equip]").forEach(btn=>btn.addEventListener("click",()=>{
 selectedEquip=btn.dataset.equip;
 document.querySelectorAll("[data-equip]").forEach(b=>b.classList.toggle("selected",b===btn));
}));
$("startBtn").addEventListener("click",()=>{
 name=$("playerName").value.trim()||"冒險者";
 $("setup").style.display="none";$("game").style.display="block";
 $("welcome").textContent=`歡迎勇敢的冒險者【${name}】！你已裝備【${equipment[selectedEquip].name}】。`;
 $("playerLabel").textContent="🧑 "+name;
 resetRound();$("status").textContent="選擇剪刀、石頭或布，開始對決！";
});
function resetRound(){playerWins=0;computerWins=0;round=1;itemUsed=false;finished=false;update();$("log").innerHTML="";$("againBtn").classList.add("hidden");document.querySelectorAll("[data-hand]").forEach(b=>b.disabled=false);$("equipmentStatus").textContent=`${equipment[selectedEquip].emoji} ${equipment[selectedEquip].name}：${equipment[selectedEquip].description}（尚未使用）`;}
function update(){$("playerScore").textContent=playerWins;$("computerScore").textContent=computerWins;$("roundLabel").textContent=`第 ${round} 回合`;}
function addLog(s){const p=document.createElement("p");p.textContent=s;$("log").prepend(p);}
function computerChoice(){return hands[Math.floor(Math.random()*hands.length)];}
function play(player){
 if(finished)return;
 let computer=computerChoice(),message="";
 if(selectedEquip==="lucky"&&!itemUsed&&confirm("🍀 要使用【幸運護符】讓電腦重新出拳嗎？\n按「確定」使用，按「取消」保留。")){
   itemUsed=true;computer=computerChoice();message="幸運護符發動！電腦重新出拳。";
 }
 const result=player===computer?"draw":((player==="剪刀"&&computer==="布")||(player==="石頭"&&computer==="剪刀")||(player==="布"&&computer==="石頭"))?"win":"lose";
 let outcome="";
 if(result==="draw"){outcome="平手！沒有人得分。";}
 else if(result==="win"){playerWins++;outcome="🎉 這回合你贏了！";}
 else if(selectedEquip==="shield"&&!itemUsed&&confirm("🛡️ 要使用【守護盾牌】抵消這次失分嗎？\n按「確定」使用，按「取消」讓電腦得分。")){
   itemUsed=true;outcome="🛡️ 守護盾牌發動！你沒有失去這一勝！";
 }else if(selectedEquip==="counter"&&!itemUsed&&confirm("💍 要使用【反擊戒指】把這次失敗反擊成勝利嗎？\n按「確定」使用，按「取消」讓電腦得分。")){
   itemUsed=true;playerWins++;outcome="⚡ 反擊戒指發動！你成功反敗為勝！";
 }else{computerWins++;outcome="💥 這回合電腦贏了！";}
 $("status").textContent=`你出了 ${emojis[player]} ${player}，電腦出了 ${emojis[computer]} ${computer}。 ${message} ${outcome}`;
 addLog(`第 ${round} 回合｜你：${player}，電腦：${computer}｜${outcome}`);
 if(itemUsed)$("equipmentStatus").textContent=`${equipment[selectedEquip].emoji} ${equipment[selectedEquip].name}：本局已使用`;
 round++;update();
 if(playerWins>=5||computerWins>=5){
  finished=true;document.querySelectorAll("[data-hand]").forEach(b=>b.disabled=true);
  $("roundLabel").textContent="🌟 最終結果";
  $("status").textContent=playerWins>=5?`🏆 恭喜 ${name} 以 ${playerWins}：${computerWins} 擊敗電腦，成為猜拳大師！`:`💻 電腦以 ${computerWins}：${playerWins} 獲勝，下次再來挑戰吧！`;
  addLog("對戰結束。");$("againBtn").classList.remove("hidden");
 }
}
document.querySelectorAll("[data-hand]").forEach(btn=>btn.addEventListener("click",()=>play(btn.dataset.hand)));
$("againBtn").addEventListener("click",()=>{resetRound();$("status").textContent="新的一局開始！裝備已重新充能，請出拳。";});
$("changeBtn").addEventListener("click",()=>{$("game").style.display="none";$("setup").style.display="block";});
</script>
</body>
</html>
